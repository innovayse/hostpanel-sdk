name: CI

# Builds the SDK with every warning as an error (an undocumented public member is one), packs it and
# keeps the package as an artifact of the run, so a reviewer can try exactly what a merge would publish.
#
# Runs on every pull request and on pushes to develop, main, release tags (vX.Y.Z) and prerelease tags
# (vX.Y.Z-preview.N); publish.yml waits for a green run of this workflow on a push before it publishes
# anything. It needs no secrets, which is also what makes it safe to run on pull requests from forks.
#
# Third-party actions are pinned to a commit SHA with the version in a comment.

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+"]

permissions:
  contents: read

# A newer push to a pull request supersedes the older run. Pushes to main and tags are never
# cancelled: publish.yml only follows a run that finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Restore
        run: |
          dotnet restore Hostpanel.Sdk.csproj
          dotnet restore Hostpanel.Sdk.Packaging/Hostpanel.Sdk.Packaging.csproj
      - name: Build (warnings are errors)
        run: |
          dotnet build Hostpanel.Sdk.csproj -c Release --no-restore -warnaserror -p:ContinuousIntegrationBuild=true
          dotnet build Hostpanel.Sdk.Packaging/Hostpanel.Sdk.Packaging.csproj -c Release --no-restore -warnaserror -p:ContinuousIntegrationBuild=true
          dotnet build tests/Hostpanel.Sdk.Tests/Hostpanel.Sdk.Tests.csproj -c Release -warnaserror -p:ContinuousIntegrationBuild=true
          dotnet build tests/Hostpanel.Sdk.Packaging.Tests/Hostpanel.Sdk.Packaging.Tests.csproj -c Release -warnaserror -p:ContinuousIntegrationBuild=true
      - name: Test
        run: |
          dotnet test tests/Hostpanel.Sdk.Tests/Hostpanel.Sdk.Tests.csproj -c Release --no-build
          dotnet test tests/Hostpanel.Sdk.Packaging.Tests/Hostpanel.Sdk.Packaging.Tests.csproj -c Release --no-build
      - name: Pack
        run: |
          dotnet pack Hostpanel.Sdk.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true
          dotnet pack Hostpanel.Sdk.Packaging/Hostpanel.Sdk.Packaging.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true
      - name: Check the package carries the source generator
        run: unzip -l artifacts/Hostpanel.Sdk.[0-9]*.nupkg | grep -q "analyzers/dotnet/cs/Hostpanel.Sdk.Generators.dll"
      - name: Upload the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-package
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 14
