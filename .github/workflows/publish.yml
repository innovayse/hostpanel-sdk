name: Publish

# Packs the SDK and pushes it to nuget.org, so plugin authors pin a package version instead of
# referencing source.
#
# Runs once the CI workflow has finished green for a push to main or to a version tag, on exactly the
# commit CI tested. A pull request run of CI never publishes, even from a fork branch that happens to be
# named main. A release tag vX.Y.Z must equal <Version> in Directory.Build.props. A prerelease tag
# vX.Y.Z-preview.N publishes X.Y.Z-preview.N from a commit whose <Version> is X.Y.Z, so plugin authors can
# pin an unreleased version from develop like any other package; NuGet never offers a prerelease to a
# consumer who did not ask for one. Either way a tag can never publish a package whose version says
# something else.
#
# Idempotent per version: `dotnet nuget push --skip-duplicate` turns a version the feed already has
# into a no-op, so a merge that does not raise <Version> publishes nothing and fails nothing, and a
# tag on a version main already published is a no-op too.
#
# Normally no stored API key: nuget.org trusted publishing trusts this repository, this workflow file
# and the `nuget` environment, and exchanges the job's GitHub identity token for a short lived key on
# every run. The only setting is the repository variable NUGET_USER, the nuget.org account that owns
# the trusted publishing policy. Without it the run says so and ends green: an unconfigured feed is
# not a failed workflow. The policy does not cover a package id nuget.org has not seen yet, so the
# first push of a new package id falls back to the environment secret NUGET_API_KEY, when it is set.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

# One publish at a time; a later one waits rather than cancelling a push in flight.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the package
    # CI also runs on pushes to develop; only a green push run of main or a version tag publishes.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The trusted publishing policy on nuget.org names this environment.
    environment: nuget
    permissions:
      contents: read
      # Lets the job ask GitHub for the identity token nuget.org trusts.
      id-token: write
    env:
      NUGET_USER: ${{ vars.NUGET_USER }}
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
      # The branch or tag name the CI run was for.
      SOURCE_REF: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Check publishing is configured
        id: feed
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::notice::SDK package not published: set the repository variable NUGET_USER to the nuget.org account that owns the trusted publishing policy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.feed.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Work out the package version
        id: version
        if: steps.feed.outputs.configured == 'true'
        run: |
          set -eu
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          case "$SOURCE_REF" in
            main)
              package="$version" ;;
            "v$version")
              package="$version" ;;
            "v$version"-preview.*)
              suffix="${SOURCE_REF#"v$version-"}"
              if ! printf '%s' "$suffix" | grep -Eq '^preview\.[0-9]+$'; then
                echo "Tag $SOURCE_REF is not v$version-preview.N, refusing to publish."
                exit 1
              fi
              package="$version-$suffix" ;;
            *)
              echo "Tag $SOURCE_REF does not match <Version>$version</Version> in Directory.Build.props, refusing to publish."
              exit 1 ;;
          esac
          echo "Publishing $package from $SOURCE_REF."
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - if: steps.feed.outputs.configured == 'true'
        uses: ./.github/actions/setup-dotnet
      # Both packages are packed with the one version worked out above, so the pair moves together; the
      # packaging package depends on that version of the SDK package or a later one (a project reference packs as a minimum version).
      - name: Pack
        if: steps.feed.outputs.configured == 'true'
        run: |
          dotnet pack Hostpanel.Sdk.csproj -c Release -o artifacts -warnaserror -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.package }}
          dotnet pack Hostpanel.Sdk.Packaging/Hostpanel.Sdk.Packaging.csproj -c Release -o artifacts -warnaserror -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.package }}
      - name: Get a short lived nuget.org key
        id: login
        if: steps.feed.outputs.configured == 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      # Each package is pushed on its own. The short lived key only covers package ids the trusted
      # publishing policy knows; a brand new package id is refused with 403. In that case the push is
      # retried once with the environment secret NUGET_API_KEY, when it is set.
      - name: Push (a version the feed already has is skipped)
        if: steps.feed.outputs.configured == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          NUGET_FALLBACK_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -u
          for package in artifacts/*.nupkg; do
            if dotnet nuget push "$package" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate; then
              continue
            fi
            if [ -z "$NUGET_FALLBACK_KEY" ]; then
              echo "::error::Push of $package failed and the environment secret NUGET_API_KEY is not set."
              exit 1
            fi
            echo "Push of $package with the trusted publishing key failed, retrying with the environment secret."
            dotnet nuget push "$package" --source "$NUGET_SOURCE" --api-key "$NUGET_FALLBACK_KEY" --skip-duplicate
          done
